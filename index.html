<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kokochi Studio — Coming Soon</title>
  <meta name="description" content="Kokochi Studio: jewelry and interior design. Join the list for first access to our launch.">
  <meta property="og:title" content="Kokochi Studio — Coming Soon">
  <meta property="og:description" content="Jewelry and interior design. Join the list for first access to our launch.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f6f1ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1ea;
      --ink: #2b2622;
      --muted: #7a6f66;
      --line: #d9cfc4;
      --accent: #a8865a;
      --accent-ink: #ffffff;
      --error: #a14a3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 300;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 20px 32px;
    }
    .wrap { width: 100%; max-width: 560px; text-align: center; }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      font-size: clamp(44px, 10vw, 76px);
      line-height: 1.02;
      letter-spacing: 0.01em;
    }
    h1 em { font-style: italic; color: var(--accent); }
    .rule {
      width: 48px; height: 1px; background: var(--accent);
      margin: 32px auto;
    }
    .pitch {
      font-size: 17px;
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto 36px;
    }
    form {
      display: flex;
      gap: 10px;
      max-width: 440px;
      margin: 0 auto;
    }
    input[type="email"] {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 12px 4px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="email"]::placeholder { color: #a99d92; }
    input[type="email"]:focus { border-color: var(--ink); }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-ink);
      background: var(--ink);
      border: 0;
      padding: 12px 22px;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    button:hover, button:focus-visible { background: var(--accent); }
    button:disabled { opacity: .6; cursor: default; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .note { font-size: 13px; color: var(--muted); margin-top: 16px; min-height: 1.6em; }
    .note.error { color: var(--error); }
    .thanks { display: none; }
    .thanks h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      font-size: 32px;
      margin-bottom: 8px;
    }
    .thanks p { color: var(--muted); }
    .done form, .done .note { display: none; }
    .done .thanks { display: block; }
    footer {
      text-align: center;
      padding: 28px 20px 36px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    footer a:hover { color: var(--ink); border-color: var(--ink); }
    footer .sep { margin: 0 10px; }
    @media (max-width: 480px) {
      form { flex-direction: column; gap: 14px; }
      button { padding: 14px 22px; }
      .pitch { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wrap" id="signup">
      <p class="eyebrow">Jewelry &amp; Interiors</p>
      <h1>Kokochi <em>Studio</em></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="pitch">Pieces to wear and spaces to live in, made with care. We're opening soon. Join the list for first access to our launch collection.</p>

      <form id="form" action="https://formspree.io/f/xnppyjgz" method="POST" novalidate>
        <label for="email" class="hp">Email address</label>
        <input id="email" type="email" name="email" placeholder="Your email address" autocomplete="email" required>
        <div class="hp" aria-hidden="true">
          <label for="_gotcha">Leave this empty</label>
          <input id="_gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
        </div>
        <button type="submit" id="submit">Notify me</button>
      </form>
      <p class="note" id="note" role="status" aria-live="polite"></p>

      <div class="thanks" role="status" aria-live="polite">
        <h2>Thank you</h2>
        <p>You're on the list. We'll be in touch before we open.</p>
      </div>
    </div>
  </main>

  <footer>
    <span>&copy; <span id="year">2026</span> Kokochi Studio</span><span class="sep">·</span><a href="https://instagram.com/Kokochi_design" target="_blank" rel="noopener">Instagram</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    var form = document.getElementById('form');
    var note = document.getElementById('note');
    var btn = document.getElementById('submit');
    var wrap = document.getElementById('signup');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      note.classList.remove('error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        note.textContent = 'Please enter a valid email address.';
        note.classList.add('error');
        form.email.focus();
        return;
      }
      btn.disabled = true;
      note.textContent = 'Sending…';
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function (res) {
        if (res.ok) {
          wrap.classList.add('done');
        } else {
          return res.json().then(function (data) {
            throw new Error(data && data.errors ? data.errors.map(function (x) { return x.message; }).join(', ') : 'Something went wrong.');
          });
        }
      }).catch(function (err) {
        note.textContent = (err && err.message ? err.message : 'Something went wrong.') + ' Please try again.';
        note.classList.add('error');
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
